name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B -ntp -DskipTests clean package

    - name: Run tests
      run: mvn -B -ntp test
      env:
        # Test dùng embedded mongo / stub - KHÔNG cần real credentials
        MONGODB_URI_TEST: mongodb://localhost:27017/test_db

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
        retention-days: 7

  # ===== Optional: Deploy to AWS ECS (chỉ chạy khi có secrets AWS đầy đủ) =====
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true   # không block build vì chưa config AWS
    steps:
    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: app-jar

    - name: Configure AWS credentials (OIDC v2)
      uses: aws-actions/configure-aws-credentials@v4
        # region ap-southeast-1 (Singapore)
        # yêu cầu GitHub OIDC + AWS IAM Role
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ap-southeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: qldhjava
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Render ECS task definition
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ecs/task-definition.json
        container-name: qldhjava
        image: ${{ steps.login-ecr.outputs.registry }}/qldhjava:${{ github.sha }}

    - name: Deploy to ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ecs/task-definition.json
        service: qldhjava-service
        cluster: qldhjava-cluster
        wait-for-service-stability: true