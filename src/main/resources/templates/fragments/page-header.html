<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Việt Đức</title>
</head>
<body>
<th:block th:fragment="header(title, subtitle)">
    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h2 th:text="${title}">Tiêu đề</h2>
            <div class="subtitle" th:text="${subtitle}" th:if="${subtitle}">Mô tả</div>
        </div>
        <div><th:block th:replace="${__${'actions'}__} ?: ~{}"></th:block></div>
    </div>
</th:block>
</body>
</html>
