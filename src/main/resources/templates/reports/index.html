<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="vi">
<head>
    <title>Báo cáo Thống kê - Nhà Máy Nhựa Việt Đức</title>
</head>
<body>
<section layout:fragment="content">
    <style>
        .stat-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); text-align: center; }
        .stat-card .icon { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 15px; }
        .stat-card h2 { font-size: 2.5rem; font-weight: 700; }
        .stat-card .label { color: #6c757d; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .chart-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
    </style>

    <!-- Page Header -->
    <div class="page-header mb-4">
        <h2><i class="bi bi-graph-up me-2"></i>Báo cáo Thống kê</h2>
        <p class="text-muted mb-0">Tổng quan tình hình hoạt động</p>
    </div>

    <!-- Overview Stats -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="icon bg-primary bg-opacity-10 text-primary">
                    <i class="bi bi-box-seam"></i>
                </div>
                <h2 class="text-primary mb-0" th:text="${totalOrders}">0</h2>
                <div class="label mt-2">Tổng đơn hàng</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="icon bg-success bg-opacity-10 text-success">
                    <i class="bi bi-currency-dollar"></i>
                </div>
                <h2 class="text-success mb-0" th:text="${#numbers.formatDecimal(revenue, 0, 'POINT', 0, 'COMMA')}">0</h2>
                <div class="label mt-2">Tổng doanh thu (VND)</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="icon bg-info bg-opacity-10 text-info">
                    <i class="bi bi-check-circle"></i>
                </div>
                <h2 class="text-info mb-0" th:text="${count_hoan_thanh}">0</h2>
                <div class="label mt-2">Đơn hoàn thành</div>
            </div>
        </div>
    </div>

    <!-- Status Breakdown -->
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="chart-card">
                <h5 class="mb-4"><i class="bi bi-pie-chart me-2"></i>Tình hình Đơn hàng</h5>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="d-flex align-items-center p-3 bg-secondary bg-opacity-10 rounded">
                            <div class="me-3">
                                <span class="badge bg-secondary rounded-circle p-2">
                                    <i class="bi bi-hourglass-split"></i>
                                </span>
                            </div>
                            <div>
                                <div class="h4 mb-0" th:text="${count_cho_xac_nhan}">0</div>
                                <small class="text-muted">Chờ xác nhận</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="d-flex align-items-center p-3 bg-info bg-opacity-10 rounded">
                            <div class="me-3">
                                <span class="badge bg-info rounded-circle p-2">
                                    <i class="bi bi-check-lg"></i>
                                </span>
                            </div>
                            <div>
                                <div class="h4 mb-0" th:text="${count_da_xac_nhan}">0</div>
                                <small class="text-muted">Đã xác nhận</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="d-flex align-items-center p-3 bg-warning bg-opacity-10 rounded">
                            <div class="me-3">
                                <span class="badge bg-warning rounded-circle p-2">
                                    <i class="bi bi-tools"></i>
                                </span>
                            </div>
                            <div>
                                <div class="h4 mb-0" th:text="${count_dang_san_xuat}">0</div>
                                <small class="text-muted">Đang sản xuất</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="d-flex align-items-center p-3 bg-success bg-opacity-10 rounded">
                            <div class="me-3">
                                <span class="badge bg-success rounded-circle p-2">
                                    <i class="bi bi-check-circle"></i>
                                </span>
                            </div>
                            <div>
                                <div class="h4 mb-0" th:text="${count_hoan_thanh}">0</div>
                                <small class="text-muted">Hoàn thành</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="chart-card">
                <h5 class="mb-4"><i class="bi bi-exclamation-triangle me-2"></i>Cần chú ý</h5>
                <div class="list-group">
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-hourglass-split text-warning me-2"></i>
                            Đơn chờ xác nhận
                        </div>
                        <span class="badge bg-warning rounded-pill" th:text="${count_cho_xac_nhan}">0</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-tools text-info me-2"></i>
                            Đơn đang sản xuất
                        </div>
                        <span class="badge bg-info rounded-pill" th:text="${count_dang_san_xuat}">0</span>
                    </div>
                </div>
                <div class="mt-4 p-3 bg-light rounded text-center">
                    <p class="mb-2 text-muted">Tỷ lệ hoàn thành đơn hàng</p>
                    <div class="progress" style="height: 20px;">
                        <div class="progress-bar bg-success" role="progressbar"
                             th:style="'width: ' + ${totalOrders > 0 ? (count_hoan_thanh * 100 / totalOrders) : 0} + '%'"
                             th:attrappend="aria-valuenow=${totalOrders > 0 ? (count_hoan_thanh * 100 / totalOrders) : 0}">
                        </div>
                    </div>
                    <p class="mt-2 mb-0">
                        <strong th:text="${totalOrders > 0 ? #numbers.formatDecimal(count_hoan_thanh * 100.0 / totalOrders, 1, 1) : '0'}">0</strong>%
                        hoàn thành
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
