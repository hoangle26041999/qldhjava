<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="vi">
<head>
    <title>Quản lý Phát sinh gia công</title>
</head>
<body>
<section layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-tools me-2"></i>Quản lý Phát sinh gia công</h2>
            <p class="text-muted mb-0">CNC, Ghép cánh, Chỉ soi, Phào nổi, Ô fix, Khác, ... — các loại phụ phí khi tạo đơn.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/admin/processing-fees/cleanup" class="btn btn-outline-secondary"
               onclick="return confirm('Dọn các phát sinh lỗi (id rỗng)? Thường chỉ cần sau khi test thủ công.');">
                <i class="bi bi-trash3"></i> Dọn rác
            </a>
            <button type="button" class="btn btn-warning text-dark" onclick="openAdd()">
                <i class="bi bi-plus-circle"></i> Thêm phát sinh
            </button>
        </div>
    </div>

    <!-- Thông báo -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Thứ tự</th>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th>Mô tả</th>
                        <th class="text-end">Đơn giá mặc định</th>
                        <th>ĐVT</th>
                        <th class="text-center">Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="feeTbody">
                    <tr th:each="it,stat : ${items}">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <span class="badge bg-soft-primary" th:text="${it.displayOrder}">1</span>
                        </td>
                        <td><code th:text="${it.code}">CNC</code></td>
                        <td><strong th:text="${it.name}">CNC</strong></td>
                        <td th:text="${it.description}">--</td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(it.defaultUnitPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</td>
                        <td th:text="${it.unit}">bộ</td>
                        <td class="text-center">
                            <span th:if="${it.active}" class="badge bg-primary">Đang dùng</span>
                            <span th:unless="${it.active}" class="badge bg-secondary">Tắt</span>
                        </td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-primary edit-btn"
                                    th:attr="data-id=${it.id},
                                            data-code=${it.code},
                                            data-name=${it.name},
                                            data-desc=${it.description},
                                            data-price=${it.defaultUnitPrice},
                                            data-unit=${it.unit},
                                            data-active=${it.active},
                                            data-order=${it.displayOrder}">
                                <i class="bi bi-pencil"></i> Sửa
                            </button>
                            <a th:href="@{/admin/processing-fees/delete/{id}(id=${it.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Xoá phát sinh này?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="9" class="text-center text-muted py-4">Chưa có phát sinh nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Thêm / Sửa -->
    <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/admin/processing-fees/save}" id="feeForm">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title" id="modalTitle">Thêm phát sinh</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="iId" value="">

                    <div class="row g-2">
                        <div class="col-4">
                            <label class="form-label">Mã <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="code" id="iCode"
                                   placeholder="VD: CNC" required maxlength="50">
                        </div>
                        <div class="col-8">
                            <label class="form-label">Tên hiển thị <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="name" id="iName"
                                   placeholder="VD: Cắt CNC" required maxlength="200">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" name="description" id="iDesc" rows="2" maxlength="500"></textarea>
                    </div>

                    <div class="row g-2 mt-2">
                        <div class="col-6">
                            <label class="form-label">Đơn giá gợi ý (VND)</label>
                            <input type="number" class="form-control" name="defaultUnitPrice" id="iPrice"
                                   min="0" step="1000" value="0">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Đơn vị tính</label>
                            <select class="form-select" name="unit" id="iUnit">
                                <option value="bộ">bộ</option>
                                <option value="cánh">cánh</option>
                                <option value="cái">cái</option>
                                <option value="m²">m²</option>
                                <option value="lần">lần</option>
                                <option value="mét">mét</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-2 mt-2">
                        <div class="col-6">
                            <label class="form-label">Thứ tự hiển thị</label>
                            <input type="number" class="form-control" name="displayOrder" id="iOrder"
                                   min="0" step="1" value="0"
                                   title="Số nhỏ hiện trước. Mặc định khi thêm mới sẽ tự đặt = max + 1.">
                            <small class="text-muted">Số nhỏ = hiện trước.</small>
                        </div>
                        <div class="col-6 d-flex align-items-end">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="active" id="iActive" value="true" checked>
                                <label class="form-check-label" for="iActive">Đang dùng</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-warning text-dark">
                        <i class="bi bi-save"></i> Lưu
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

<section layout:fragment="scripts">
    <script>
        // Biến global để tái sử dụng modal
        const itemModal = new bootstrap.Modal(document.getElementById('itemModal'));

        function openAdd() {
            document.getElementById('modalTitle').textContent = 'Thêm phát sinh';
            document.getElementById('feeForm').reset();          // reset toàn bộ form
            document.getElementById('iId').value = '';            // đảm bảo id rỗng
            document.getElementById('iActive').checked = true;    // mặc định đang dùng
            document.getElementById('iUnit').value = 'bộ';
            document.getElementById('iOrder').value = 0;          // service sẽ tự gán max+1
            itemModal.show();
        }

        function openEdit(btn) {
            document.getElementById('modalTitle').textContent = 'Sửa phát sinh';
            document.getElementById('iId').value    = btn.dataset.id    || '';
            document.getElementById('iCode').value  = btn.dataset.code  || '';
            document.getElementById('iName').value  = btn.dataset.name  || '';
            document.getElementById('iDesc').value  = btn.dataset.desc  || '';
            document.getElementById('iPrice').value = btn.dataset.price || 0;
            document.getElementById('iUnit').value  = btn.dataset.unit  || 'bộ';
            document.getElementById('iOrder').value = btn.dataset.order || 0;
            document.getElementById('iActive').checked = btn.dataset.active === 'true';
            itemModal.show();
        }

        // Gắn handler cho nút Sửa
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => openEdit(btn));
            });
        });
    </script>
</section>
</body>
</html>
