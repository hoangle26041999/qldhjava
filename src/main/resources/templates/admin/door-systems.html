<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="vi">
<head>
    <title>Quản lý Dòng cánh</title>
</head>
<body>
<section layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-grid-3x3-gap me-2"></i>Quản lý Dòng cánh</h2>
            <p class="text-muted mb-0">Hệ cửa (Hệ 40, Hệ 45, Hệ 50, ...) — dùng để chọn nhanh khi tạo đơn.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#itemModal" onclick="openAdd()">
            <i class="bi bi-plus-circle"></i> Thêm dòng cánh
        </button>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>#</th><th>Tên</th><th>Mô tả</th>
                        <th class="text-center">Mặc định</th>
                        <th class="text-center">Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="it,stat : ${items}">
                        <td th:text="${stat.count}">1</td>
                        <td><strong th:text="${it.name}">Hệ 40</strong></td>
                        <td th:text="${it.description}">--</td>
                        <td class="text-center">
                            <span th:if="${it.isDefault}" class="badge bg-success"><i class="bi bi-star-fill"></i> Mặc định</span>
                            <span th:unless="${it.isDefault}" class="text-muted">—</span>
                        </td>
                        <td class="text-center">
                            <span th:if="${it.active}" class="badge bg-primary">Đang dùng</span>
                            <span th:unless="${it.active}" class="badge bg-secondary">Tắt</span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary edit-btn" data-bs-toggle="modal" data-bs-target="#itemModal"
                                    th:attr="data-id=${it.id},
                                            data-name=${it.name},
                                            data-desc=${it.description},
                                            data-default=${it.isDefault},
                                            data-active=${it.active},
                                            data-order=${it.displayOrder}">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <a th:href="@{/admin/door-systems/delete/{id}(id=${it.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Xoá dòng cánh này?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="6" class="text-center text-muted py-4">Chưa có dòng cánh nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/admin/door-systems/save}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Thêm dòng cánh</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="iId">
                    <div class="mb-3">
                        <label class="form-label">Tên <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" id="iName" placeholder="Vd: Hệ 40" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" name="description" id="iDesc" rows="2"></textarea>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" name="isDefault" id="iDefault" value="true">
                                <label class="form-check-label" for="iDefault">Là mặc định</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" name="active" id="iActive" value="true" checked>
                                <label class="form-check-label" for="iActive">Đang dùng</label>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label">Thứ tự hiển thị</label>
                        <input type="number" class="form-control" name="displayOrder" id="iOrder" value="0">
                    </div>
                    <input type="hidden" name="_isDefault" value="false">
                    <input type="hidden" name="_active" value="false">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Lưu</button>
                </div>
            </form>
        </div>
    </div>
</section>

<section layout:fragment="scripts">
    <script>
        function openAdd() {
            document.getElementById('modalTitle').textContent = 'Thêm dòng cánh';
            document.getElementById('iId').value = '';
            document.getElementById('iName').value = '';
            document.getElementById('iDesc').value = '';
            document.getElementById('iDefault').checked = false;
            document.getElementById('iActive').checked = true;
            document.getElementById('iOrder').value = 0;
        }
        function openEdit(btn) {
            document.getElementById('modalTitle').textContent = 'Sửa dòng cánh';
            document.getElementById('iId').value = btn.dataset.id || '';
            document.getElementById('iName').value = btn.dataset.name || '';
            document.getElementById('iDesc').value = btn.dataset.desc || '';
            document.getElementById('iDefault').checked = btn.dataset.default === 'true';
            document.getElementById('iActive').checked = btn.dataset.active === 'true';
            document.getElementById('iOrder').value = btn.dataset.order || 0;
        }
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => openEdit(btn));
            });
        });
    </script>
</section>
</body>
</html>
